# 汇然：一台服务器上跑两个站
#   huiranpk.com / www.huiranpk.com  → 独立站
#   kc.huiranpk.com                  → 库存台账（反代到本机 8080）
#
# 用法：复制到 /etc/nginx/conf.d/huiranpk.conf（或 sites-available 后 ln -s 启用），
#       把 <服务器IP>、证书路径、独立站目录按实际情况改掉，然后：
#       nginx -t && systemctl reload nginx
#
# 证书申请（DNS 指好、80 端口放行后执行）：
#   certbot --nginx -d huiranpk.com -d www.huiranpk.com -d kc.huiranpk.com
# （用 acme.sh 就把证书路径改成 acme.sh 生成的路径）

# ─────────── ① 独立站：裸域名 + www ───────────

server {
    listen 80;
    listen [::]:80;
    server_name huiranpk.com www.huiranpk.com;
    # 统一到 www（想反过来就把两行对调）
    return 301 https://www.huiranpk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.huiranpk.com;

    ssl_certificate     /etc/letsencrypt/live/huiranpk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huiranpk.com/privkey.pem;

    # ── 独立站是静态站：改成它的目录 ──
    root /var/www/huiranpk;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 独立站是 PHP（WordPress 等）：启用下面这段，并把上面 root 指到站点目录 ──
    # location ~ \.php$ {
    #     include snippets/fastcgi-php.conf;
    #     fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    # }

    # ── 独立站是 Node 应用：注释掉 root/location，改用反代 ──
    # location / {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}

# ─────────── ② 库存台账：只在 kc 子域名 ───────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kc.huiranpk.com;

    ssl_certificate     /etc/letsencrypt/live/huiranpk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huiranpk.com/privkey.pem;

    # 这个应用没有登录（公开模式），别让搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 导入 Excel 走的是 base64，20MB 的表会变成 ~27MB 请求体；
    # 默认 1m 会直接 413，必须放开。
    client_max_body_size 40m;

    # 一键同步云端、导入解析都可能跑几十秒
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 强烈建议开启：一个账号密码，挡住外面的人改台账
    # 生成密码文件：
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/htpasswd-inventory huiran
    # auth_basic "汇然库存台账";
    # auth_basic_user_file /etc/nginx/htpasswd-inventory;

    gzip on;
    gzip_static on;                 # 直接发构建时预生成的 .js.gz / .css.gz
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 静态资源带内容哈希，可以长缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# ─────────── ③ 兜底：不认识的域名/直接用 IP 访问 ───────────
# 不加这段的话，用 IP 或随便一个域名解析过来，Nginx 会拿第一个站点来应答，
# 有可能直接把库存台账暴露出去。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
