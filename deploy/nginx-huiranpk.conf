# 汇然：一台服务器上跑两个站（适配 Ubuntu 22.04 自带的 nginx 1.18）
#   huiranpk.com（裸域名）      → 301 到 www
#   www.huiranpk.com            → 独立站（company-site，本机 8081）
#   kc.huiranpk.com             → 库存台账（本机 8080）
#   其它域名 / 直接用 IP 访问   → 444 直接断开
#
# 用法：复制到 /etc/nginx/conf.d/huiranpk.conf
#       nginx -t && systemctl reload nginx
#
# 证书（二选一）：
#   A. HTTP 校验： certbot --nginx -d huiranpk.com -d www.huiranpk.com -d kc.huiranpk.com
#   B. DNS 校验（国内更稳，走阿里云 DNS API）：见服务器上的 /root/issue-cert.sh
#      证书会装到 /etc/letsencrypt/live/huiranpk.com/ 下

# ─────────── ① 80 端口：统一跳 https ───────────

server {
    listen 80;
    listen [::]:80;
    server_name huiranpk.com www.huiranpk.com;
    return 301 https://www.huiranpk.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kc.huiranpk.com;
    return 301 https://kc.huiranpk.com$request_uri;
}

# ─────────── ② 独立站：www ───────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.huiranpk.com;

    ssl_certificate     /etc/letsencrypt/live/huiranpk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huiranpk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 独立站上传：单图 4MB / 单视频 16MB，前端转成 base64 后约 +1/3，服务端上限 24MB
    client_max_body_size 30m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}

# ─────────── ③ 裸域名 → www ───────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name huiranpk.com;

    ssl_certificate     /etc/letsencrypt/live/huiranpk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huiranpk.com/privkey.pem;

    return 301 https://www.huiranpk.com$request_uri;
}

# ─────────── ④ 库存台账：只在 kc 子域名 ───────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kc.huiranpk.com;

    ssl_certificate     /etc/letsencrypt/live/huiranpk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huiranpk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 这个应用没有登录（公开模式），别让搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 导入 Excel 走 base64，20MB 的表会变成 ~27MB 请求体；默认 1m 会直接 413
    client_max_body_size 40m;

    # 一键同步云端、导入解析都可能跑几十秒
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 建议开启：一个账号密码，挡住外面的人改台账
    #   sudo apt install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/htpasswd-inventory huiran
    # 然后把下面两行的注释去掉
    # auth_basic "汇然库存台账";
    # auth_basic_user_file /etc/nginx/htpasswd-inventory;

    gzip on;
    gzip_static on;                 # 直接发构建时预生成的 .js.gz / .css.gz
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# ─────────── ⑤ 兜底：陌生域名 / 直接用 IP 访问 ───────────
# 不加这段，用 IP 或随便解析一个域名过来，Nginx 会拿第一个站点应答。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/huiranpk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huiranpk.com/privkey.pem;

    return 444;
}
